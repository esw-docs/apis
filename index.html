<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customs Catalog URL Builder</title>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13151b;
      --surface2: #1c1f28;
      --border: #262a36;
      --accent: #00e5a0;
      --text: #e8eaf0;
      --muted: #6b7280;
      --code-bg: #0d1117;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
      font-size: 13px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input,
    .field select {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      min-width: 130px;
      font-size: 13px;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0c10;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-secondary:hover { border-color: var(--text); color: var(--text); }

    .output {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      line-height: 1.8;
      min-height: 48px;
      position: relative;
    }

    .output .placeholder {
      color: var(--muted);
      font-style: italic;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      display: none;
    }

    .copy-btn:hover { color: var(--text); }

    .hl-host { color: var(--muted); }
    .hl-path { color: #c9d1d9; }
    .hl-key  { color: #79c0ff; }
    .hl-val  { color: var(--accent); }
    .hl-sep  { color: var(--muted); }
  </style>
</head>
<body>

  <h2>🔗 Customs Catalog URL Builder</h2>
  <p class="subtitle">Build paginated Customs Catalog API request URLs</p>

  <!-- Core controls -->
  <div class="section">
    <div class="section-title">Endpoint &amp; Pagination</div>
    <div class="row">
      <div class="field">
        <label>Endpoint</label>
        <select id="bEndpoint" onchange="updateFilters()">
          <option value="/api/v2/Classifications">Classifications</option>
          <option value="/api/v2/Classifications/ChapterClassifications">ChapterClassifications</option>
          <option value="/api/v2/Products/ProductsUi">Products / ProductsUi</option>
          <option value="/api/v2/Products/DefaultClassifiedProducts">Products / DefaultClassified</option>
          <option value="/api/v2/Products/Invalid">Products / Invalid (cursor)</option>
          <option value="/api/v2/Vat">Vat</option>
          <option value="/api/v2/VatBandConfig">VatBandConfig</option>
        </select>
      </div>
      <div class="field">
        <label>Page Number</label>
        <input type="number" id="bPage" value="1" min="1" style="min-width:90px">
      </div>
      <div class="field">
        <label>Page Size</label>
        <input type="number" id="bSize" value="25" min="1" max="200" style="min-width:90px">
      </div>
      <div class="field">
        <label>Order By</label>
        <input type="text" id="bOrderBy" placeholder="fieldName">
      </div>
      <div class="field">
        <label>Direction</label>
        <select id="bAsc">
          <option value="">— none —</option>
          <option value="true">Ascending</option>
          <option value="false">Descending</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Dynamic filters -->
  <div class="section" id="filterSection" style="display:none">
    <div class="section-title" id="filterTitle">Filters</div>
    <div class="row" id="filterFields"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-primary" onclick="buildUrl()">Build URL</button>
    <button class="btn-secondary" onclick="resetAll()">Reset</button>
  </div>

  <!-- Output -->
  <div class="output" id="output">
    <span class="placeholder">Fill in the fields above and click "Build URL"</span>
    <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copy</button>
  </div>

  <script>
    const HOST = 'https://logistics-customscatalog-api.sandbox.eshopworld.com';

    const FILTER_MAP = {
      '/api/v2/Classifications':                        ['RegionCode'],
      '/api/v2/Classifications/ChapterClassifications': ['RegionCode', 'ChapterCode', 'SectionCode'],
      '/api/v2/Products/ProductsUi':                    ['BrandCode', 'DefaultClassification', 'TenantCode'],
      '/api/v2/Products/DefaultClassifiedProducts':     ['BrandCode', 'DefaultClassification'],
      '/api/v2/Products/Invalid':                       ['BrandCode', 'SearchType', 'ContinuationToken'],
      '/api/v2/Vat':                                    ['VatBandId', 'RegionCode', 'CountryIso'],
      '/api/v2/VatBandConfig':                          ['VatBandId', 'RegionCode'],
    };

    function updateFilters() {
      const endpoint = document.getElementById('bEndpoint').value;
      const filters  = FILTER_MAP[endpoint] || [];
      const section  = document.getElementById('filterSection');
      const fields   = document.getElementById('filterFields');
      const title    = document.getElementById('filterTitle');

      if (!filters.length) { section.style.display = 'none'; return; }

      title.textContent = `Filters — ${endpoint.split('/').pop()}`;
      fields.innerHTML = filters.map(f => `
        <div class="field">
          <label>${f}</label>
          <input type="text" data-filter="${f}" placeholder="${f}">
        </div>
      `).join('');
      section.style.display = 'block';
    }

    function buildUrl() {
      const endpoint = document.getElementById('bEndpoint').value;
      const page     = document.getElementById('bPage').value;
      const size     = document.getElementById('bSize').value;
      const orderBy  = document.getElementById('bOrderBy').value.trim();
      const asc      = document.getElementById('bAsc').value;

      const params = new URLSearchParams();
      params.append('PageNumber', page);
      params.append('PageSize', size);

      document.querySelectorAll('[data-filter]').forEach(input => {
        if (input.value.trim()) params.append(input.dataset.filter, input.value.trim());
      });

      if (orderBy) params.append('OrderByField', orderBy);
      if (asc)     params.append('IsOrderByAsc', asc);

      const url = `${HOST}${endpoint}?${params.toString()}`;

      const highlighted = url
        .replace(HOST, `<span class="hl-host">${HOST}</span>`)
        .replace(endpoint, `<span class="hl-path">${endpoint}</span>`)
        .replace(/([?&])([^=]+)=([^&]+)/g, (_, sep, key, value) =>
          `<span class="hl-sep">${sep === '?' ? '?' : '&amp;'}</span>` +
          `<span class="hl-key">${key}</span>` +
          `<span class="hl-sep">=</span>` +
          `<span class="hl-val">${decodeURIComponent(value)}</span>`
        );

      const out = document.getElementById('output');
      out.innerHTML = highlighted + `<button class="copy-btn" id="copyBtn" onclick="copyUrl('${encodeURIComponent(url)}')">Copy</button>`;
      document.getElementById('copyBtn').style.display = 'block';
    }

    function copyUrl(encoded) {
      const url = encoded ? decodeURIComponent(encoded) : '';
      if (url) navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    function resetAll() {
      document.getElementById('bPage').value    = '1';
      document.getElementById('bSize').value    = '25';
      document.getElementById('bOrderBy').value = '';
      document.getElementById('bAsc').value     = '';
      document.getElementById('bEndpoint').selectedIndex = 0;
      updateFilters();
      document.getElementById('output').innerHTML =
        '<span class="placeholder">Fill in the fields above and click "Build URL"</span>';
    }

    updateFilters();
  </script>
</body>
</html>
